services:
  db:
    image: postgres:16-alpine
    container_name: kalshi-bot-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-kalshi_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kalshi_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    image: ghcr.io/kel-reid/kalshi-trading-bot:latest
    container_name: kalshi-bot
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Accept environment variables passed from Doppler/host context
    environment:
      - KALSHI_ENV
      - KALSHI_API_KEY
      - KALSHI_PRIVATE_KEY
      - KALSHI_PRIVATE_KEY_PATH
      - RISK_GAMMA
      - MIN_SPREAD
      - ORDER_SIZE
      - TARGET_TICKER
      - TARGET_PREFERENCE
      - MAX_EXPIRATION_DAYS
      - MIN_MID_PRICE
      - MAX_MID_PRICE
      - MIN_TIME_TO_CLOSE_SECONDS
      - EXPIRATION_BUFFER_MINUTES
      - MAX_SESSION_FEES_CENTS
      - MAX_SESSION_LOSS_CENTS
      - POST_FILL_PAUSE_SECONDS
      - PRICE_VELOCITY_THRESHOLD_CENTS
      - PRICE_VELOCITY_WINDOW_SECONDS
      - PRICE_VELOCITY_QUIESCE_SECONDS
      - ORDER_DOLLARS
      - MAX_LOW_PRICE_CONTRACTS
      - LOW_PRICE_THRESHOLD_CENTS
      - MOMENTUM_SKEW_ENABLED
      - MOMENTUM_GAMMA_FACTOR
      - MAX_GAMMA_MULTIPLIER
      - QUOTE_REPLACEMENT_TOLERANCE_CENTS
      - AUTO_SWEEP_SHARD0_ENABLED
      - AUTO_SWEEP_REVERSE_ENABLED
      - SHARD0_RESERVE_DOLLARS
      - SHARD_RETAIN_DOLLARS
      - BLACKOUT_ENABLED
      - EXPIRATION_BLACKOUT_SECONDS
      - BLACKOUT_DANGER_PRICE_LOW
      - BLACKOUT_DANGER_PRICE_HIGH
      - ALERT_WEBHOOK_URL
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
    # Optional: Mount local keys ONLY if not using a secrets manager like Doppler
    # volumes:
    #   - ./kalshi_private_key_demo.pem:/app/kalshi_private_key_demo.pem:ro
    # The application logs gracefully to stdout, which Docker captures.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
