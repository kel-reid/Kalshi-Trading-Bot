services:
  db:
    image: postgres:16-alpine
    container_name: kalshi-bot-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-kalshi_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kalshi_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    image: ghcr.io/kel-reid/kalshi-trading-bot:latest
    container_name: kalshi-bot
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Accept environment variables passed from Doppler/host context
    environment:
      - KALSHI_ENV
      - KALSHI_API_KEY
      - KALSHI_PRIVATE_KEY
      - KALSHI_PRIVATE_KEY_PATH
      - RISK_GAMMA
      - MIN_SPREAD
      - ORDER_SIZE
      - TARGET_TICKER
      - MAX_EXPIRATION_DAYS
      - ALERT_WEBHOOK_URL
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
    # Optional: Mount local keys ONLY if not using a secrets manager like Doppler
    # volumes:
    #   - ./kalshi_private_key_demo.pem:/app/kalshi_private_key_demo.pem:ro
    # The application logs gracefully to stdout, which Docker captures.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
