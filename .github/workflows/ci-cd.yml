name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Terraform Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: infra

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      KALSHI_API_KEY: "dummy-key-for-testing-purposes-only"
      KALSHI_ENV: "demo"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'setup.py'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -e .

      - name: Run logic tests with pytest and generate coverage
        run: |
          pytest -v --cov=strategy --cov=execution --cov=data --cov=utils --cov-report=xml

      - name: Upload coverage reports to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kel-reid/kalshi-trading-bot
          tags: type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}, ghcr.io/kel-reid/kalshi-trading-bot:latest
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to DigitalOcean
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy docker-compose via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/Kalshi-Trading-Bot"
          timeout: 60s
          command_timeout: 10m

      - name: SSH into Droplet and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOPPLER_TOKEN
          timeout: 60s
          command_timeout: 10m
          script: |
            # 1. Enforce root access up-front (deploy path /root/ is root-only)
            if [ "$(id -u)" -ne 0 ]; then
              echo "Error: This deploy script must be run as root." >&2
              exit 1
            fi

            # 2. Verify Doppler token exists in session memory (fail-fast check)
            if [ -z "$DOPPLER_TOKEN" ]; then
              echo "Error: DOPPLER_TOKEN environment variable is missing from the deploy environment." >&2
              exit 1
            fi

            # 3. Automatically install Doppler if missing (self-healing setup)
            if ! command -v doppler > /dev/null 2>&1; then
              echo "Doppler not found. Installing..."
              apt-get update && apt-get install -y apt-transport-https ca-certificates curl gnupg
              curl -sLf --retry 3 https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key | gpg --dearmor --yes -o /usr/share/keyrings/doppler-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] https://packages.doppler.com/public/cli/deb/debian any-version main" | tee /etc/apt/sources.list.d/doppler-cli.list
              apt-get update && apt-get install -y doppler
            fi

            # 4. Perform the deploy (using the RAM-only DOPPLER_TOKEN env variable)
            cd /root/Kalshi-Trading-Bot
            echo "${{ secrets.PAT_GHCR }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            doppler run -- docker compose up -d

            # 5. Clean up dangling images older than 24 hours (preserves recent build for quick rollbacks)
            docker image prune -f --filter "until=24h"
