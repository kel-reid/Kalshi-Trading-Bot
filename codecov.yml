# Codecov configuration file
# Reference: https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: "1%"
        informational: true
    patch:
      default:
        target: auto
        threshold: "5%"
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
